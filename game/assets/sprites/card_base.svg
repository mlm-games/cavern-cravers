<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5e6d3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4c4a8;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Card background -->
  <rect x="4" y="4" width="120" height="120" rx="12" ry="12" fill="url(#cardBg)" filter="url(#shadow)" stroke="#8b7355" stroke-width="2"/>
  <!-- Inner border -->
  <rect x="12" y="12" width="104" height="104" rx="8" ry="8" fill="none" stroke="#a08060" stroke-width="1" stroke-dasharray="4,2"/>
</svg>